[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchguard-inspection"
version = "0.1.0"
description = "Normal-only visual anomaly detection with calibrated review routing and portable inference"
requires-python = ">=3.11"
authors = [{name = "Jaber Mobarak"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "scikit-learn>=1.4,<2", "Pillow>=10.4,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "onnx>=1.16,<2", "onnxruntime>=1.19,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[project.scripts]
patchguard = "patchguard.cli:main"

[tool.setuptools.package-data]
patchguard = ["static/*"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["patchguard*"]
namespaces = false
