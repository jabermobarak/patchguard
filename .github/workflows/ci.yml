name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m patchguard.cli demo --output /tmp/patchguard-artifacts
      - run: python scripts/check_benchmark.py /tmp/patchguard-artifacts/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-py${{ matrix.python }}
          path: /tmp/patchguard-artifacts
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t patchguard:test .
      - run: docker run -d --name patchguard -p 8000:8000 patchguard:test
      - run: |
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs patchguard
          exit 1
